  <script>
  (function () {
    /* 老链接把文章 id 塞在 hash 里（post.html#/post?id=post-75），现在 id 走查询串。
       这里只搬这最后一次，搬完地址就是 /post?id=post-75，后面交给路由渲染。 */
    var h = location.hash || "";
    if (h.indexOf("#/") !== 0) return;
    var page = h.replace(/^#\//, "").split("?")[0] || "post";
    var qs = h.split("?")[1] || "";
    if (qs) qs = "?" + qs;
    else if (h.indexOf("?") < 0 && location.search) qs = location.search;
    location.replace("/" + page + qs);
  })();
  </script>
