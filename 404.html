<script>
/* 404 页的正文区：最近更新、分类入口、随机一篇。
   数据来自 data.meta.js 的 window.POSTS（只有元数据，不含正文）。 */
(function () {
  var posts = window.POSTS || (window.SITE && window.SITE.posts) || [];
  if (!posts.length) return;
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function day(d) { return String(d || "").slice(0, 10); }

  var sorted = posts.slice().sort(function (a, b) {
    return String(b.date || "").localeCompare(String(a.date || ""));
  });
  var recent = $("nf-recent");
  if (recent) {
    recent.innerHTML = sorted.slice(0, 5).map(function (p) {
      return '<li><a href="/p/' + encodeURIComponent(p.id) + '">' +
        '<span class="nf-t">' + esc(p.title) + "</span>" +
        '<span class="nf-m">' + esc(day(p.date)) + (p.cat ? " · " + esc(p.cat) : "") + "</span></a></li>";
    }).join("");
  }

  var counts = {};
  posts.forEach(function (p) { if (p.cat) counts[p.cat] = (counts[p.cat] || 0) + 1; });
  var cats = $("nf-cats");
  if (cats) {
    cats.innerHTML = Object.keys(counts).sort().map(function (c) {
      return '<a class="chip" href="/writing?cat=' + encodeURIComponent(c) + '">' +
        esc(c) + '<span class="count">' + counts[c] + "</span></a>";
    }).join("");
  }

  var rnd = $("nf-random");
  if (rnd) {
    var pick = posts[Math.floor(Math.random() * posts.length)];
    if (pick && pick.id != null) rnd.setAttribute("href", "/p/" + encodeURIComponent(pick.id));
    else rnd.style.display = "none";
  }
})();
</script>
