# ============================================================
# reze520.top 的 Nginx 配置
# 放到服务器：/etc/nginx/sites-available/reze
# 然后：ln -s /etc/nginx/sites-available/reze /etc/nginx/sites-enabled/
# 检查：nginx -t      重载：systemctl reload nginx
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name reze520.top www.reze520.top;

    # 网站文件放这里
    root /var/www/reze;
    index index.html;
    charset utf-8;

    # 找不到的页面走自定义 404
    error_page 404 /404.html;

    # ---------- 压缩：文字类文件能小一半以上 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------- 缓存策略 ----------
    # 图片、样式、脚本、音频：缓存 30 天，省流量也更快
    location ~* \.(css|js|png|jpe?g|gif|webp|svg|ico|woff2?|mp3|wav|m4a|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # HTML 不缓存：你改完文章刷新就能看到，不会被旧的卡住
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 不允许访问隐藏文件（.git 之类）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 安全相关的响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ============================================================
# HTTPS 不用手写。
# 备案通过、域名能访问之后，装 certbot 跑一句就行，
# 它会自动往这个文件里追加 443 的配置和证书路径：
#
#   apt install -y certbot python3-certbot-nginx
#   certbot --nginx -d reze520.top -d www.reze520.top
#
# 证书 90 天自动续期，装完不用管。
# ============================================================
